apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: wishlists-database-secret
parameters:
  - name: POSTGRES_PASSWORD
    description: Generated once when provisioning a fresh database.
    generate: expression
    from: '[a-f0-9]{48}'
objects:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: wishlists-postgres-secret
      labels:
        app: wishlists
    type: Opaque
    stringData:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URI: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@wishlists-postgres:5432/wishlists
