apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: wishlists-build
parameters:
  - name: IMAGE_TAG
    description: Commit SHA of the application source being uploaded.
    required: true
objects:
  - apiVersion: image.openshift.io/v1
    kind: ImageStream
    metadata:
      name: wishlists
      labels:
        app: wishlists
  - apiVersion: build.openshift.io/v1
    kind: BuildConfig
    metadata:
      name: wishlists
      labels:
        app: wishlists
    spec:
      runPolicy: Serial
      source:
        type: Binary
        binary: {}
      strategy:
        type: Docker
        dockerStrategy:
          dockerfilePath: Dockerfile
      output:
        to:
          kind: ImageStreamTag
          name: wishlists:${IMAGE_TAG}
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: '1'
          memory: 1Gi
      triggers: []
      successfulBuildsHistoryLimit: 2
      failedBuildsHistoryLimit: 2
